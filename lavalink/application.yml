server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Ordre = ordre d'essai. MUSIC sert à la recherche, TV (OAuth) à la lecture.
    clients:
      - MUSIC
      - TV
      - TVHTML5_SIMPLY
      - WEB
      - ANDROID_VR
      - WEBEMBEDDED
    # YouTube bloque les IP de serveurs ("This video requires login").
    # Utiliser un compte Google JETABLE (risque de bannissement du compte).
    # 1er lancement : laisser YOUTUBE_REFRESH_TOKEN vide, suivre le lien + code
    # affichés dans les logs Lavalink, puis copier le refresh token affiché
    # dans .env (YOUTUBE_REFRESH_TOKEN=...).
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
      # Ne pas rafraîchir le token au démarrage : une erreur passagère de Google
      # (503) ferait planter tout Lavalink. Le token est rafraîchi à la 1ère lecture.
      # ⚠ Si YOUTUBE_REFRESH_TOKEN est vide, repasser à false pour obtenir le code.
      skipInitialization: true
    # Déchiffrement des signatures (nécessaire pour les clients WEB)
    remoteCipher:
      url: "http://yt-cipher:8001"
      password: "${YT_CIPHER_TOKEN:}"
      userAgent: "BigBrackBot"

  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      # Désactivé : LavaSrc 4.8+ requiert une masterDecryptionKey Deezer
      # (clé propriétaire du client Deezer). Pour réactiver, remplir
      # plugins.lavasrc.deezer.masterDecryptionKey ci-dessous et passer à true.
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
    spotify:
      clientId: "${PLUGINS_SPOTIFY_CLIENTID}"
      clientSecret: "${PLUGINS_SPOTIFY_CLIENTSECRET}"
      countryCode: "FR"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    applemusic:
      countryCode: "FR"
      mediaAPIToken: "${PLUGINS_APPLEMUSIC_MEDIAAPITOKEN}"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    deezer:
      masterDecryptionKey: ""
      formats: ["FLAC", "MP3_320", "MP3_256", "MP3_128", "MP3_64", "AAC_64"]

lavalink:
  plugins:
    # Snapshot (commit du 17/09/2026) : contient le correctif du client TV
    # ("The page needs to be reloaded", PR #233) absent de la release 1.18.2.
    # Repasser sur une release (snapshot: false) dès qu'une 1.18.3+ sort.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/

  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000

  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
